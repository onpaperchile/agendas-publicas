<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Flores</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap">
<style>
/* Concepto: mesa de roble vista desde arriba con la agenda abierta al centro (espiral en el lomo),
   y debajo una bandeja donde las páginas se ordenan agrupadas por pliego, tal como se enfrentan al abrirla. */
:root{
  --oak:#dcb88d; --oak-hi:#eed6b3; --grain-o:.55;
  --panel:#fbf7f3; --panel-2:#f1e8e0; --ink:#3b2c29; --ink-2:#7a6a64; --line:#e2d4c9;
  --accent:#a85a68; --accent-ink:#ffffff; --focus:#7b3f4d;
  --cover:#c58a96; --wire:#f7f5f3; --hole:#9d9691;
  --font:'Jost',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --oak:#5b4432; --oak-hi:#6e523a; --grain-o:.35;
    --panel:#2a2220; --panel-2:#352b28; --ink:#f3e8e1; --ink-2:#bba9a1; --line:#4b3e39;
    --accent:#e3a0ae; --accent-ink:#3a1f27; --focus:#f0b8c4; --hole:#85807c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --oak:#5b4432; --oak-hi:#6e523a; --grain-o:.35;
  --panel:#2a2220; --panel-2:#352b28; --ink:#f3e8e1; --ink-2:#bba9a1; --line:#4b3e39;
  --accent:#e3a0ae; --accent-ink:#3a1f27; --focus:#f0b8c4; --hole:#85807c;
  color-scheme:dark;
}
html,body{height:100%}
body{
  margin:0; background:var(--panel); color:var(--ink); font-family:var(--font); font-size:14px;
  display:grid; grid-template-rows:auto auto minmax(0,1fr) auto auto; overflow:hidden;
}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.in{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* encabezado */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand strong{font-size:17px;font-weight:600;letter-spacing:.2px}
.brand span{font-size:12px;color:var(--ink-2)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel-2);padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn svg{flex:none}

/* mesa */
.desk{
  position:relative; min-height:0; overflow:hidden; isolation:isolate;
  background-color:var(--oak);
  background-image:radial-gradient(120% 90% at 50% 40%,var(--oak-hi),transparent 70%);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;justify-content:center;
}
.desk::before{
  content:"";position:absolute;inset:0;z-index:-1;opacity:var(--grain-o);pointer-events:none;
  background-size:600px 400px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='400'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.004 0.3' numOctaves='3' seed='7'/><feColorMatrix values='0 0 0 0 0.42  0 0 0 0 0.27  0 0 0 0 0.13  0 0 0 0.95 -0.22'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}
.pen{position:absolute;left:3.5%;bottom:16%;width:9px;height:min(38%,300px);transform:rotate(13deg);z-index:0;
  background:linear-gradient(90deg,#94543f,#f0b49b 32%,#fcdccb 50%,#d0907a 74%,#86493a);
  clip-path:polygon(0 0,100% 0,100% 93%,50% 100%,0 93%);filter:drop-shadow(4px 6px 4px rgba(60,35,15,.35))}
.cup{position:absolute;right:3%;bottom:5%;width:clamp(84px,9vw,132px);aspect-ratio:1;border-radius:50%;z-index:0;
  background:radial-gradient(circle,#d8a56d 0 28%,#a6693a 34%,#5b3318 41%,#f2e9de 43%,#e1d3c1 100%);
  box-shadow:8px 12px 20px rgba(60,35,15,.38),inset 0 0 0 2px rgba(255,255,255,.35)}
@media (max-width:1000px),(max-height:560px){.pen,.cup{display:none}}

/* agenda */
.book{
  --ph:calc(var(--pw)*1.4189);
  position:relative;width:calc(var(--pw)*2);height:var(--ph);flex:none;margin-bottom:34px;
  perspective:calc(var(--pw)*5);
  transform:translateX(calc(var(--pw)*var(--shift,0)));
  transition:transform .85s cubic-bezier(.45,.05,.25,1);cursor:pointer;user-select:none;-webkit-user-select:none;
}
.book.noanim,.book.noanim *{transition:none!important}
.board{position:absolute;background:var(--cover);border-radius:2px;transition:opacity .5s;
  background-image:linear-gradient(135deg,rgba(255,255,255,.14),rgba(0,0,0,.12)),var(--coverImg,none);background-size:100% 100%,100% 100%;background-position:center;
  box-shadow:0 14px 26px -8px rgba(50,30,15,.55),0 2px 4px rgba(0,0,0,.25)}
.stack{position:absolute;top:0;width:var(--pw);height:var(--ph);background:#fff;transition:opacity .5s}
.stack.sl{left:calc(50% - var(--pw)*1.0293)}.stack.sr{left:calc(50% + var(--pw)*.0293)}
.leaf{position:absolute;left:calc(50% + var(--pw)*.0293);top:0;width:var(--pw);height:var(--ph);transform-origin:calc(var(--pw)*-.0293) 50%;transform-style:preserve-3d;
  transition:transform .85s cubic-bezier(.45,.05,.25,1)}
.leaf.flipped{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;background:#fff;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.front{border-radius:0 3px 3px 0}
.face.back{transform:rotateY(180deg);border-radius:3px 0 0 3px}
.face img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}
.face img.fill,.th img.fill{object-fit:fill}
.face::after{content:"";position:absolute;inset:0;pointer-events:none}
.face.front::after{background:linear-gradient(to right,rgba(40,25,20,.08),rgba(40,25,20,0) 6%)}
.face.back::after{background:linear-gradient(to left,rgba(40,25,20,.08),rgba(40,25,20,0) 6%)}
.holes{position:absolute;top:0;bottom:0;width:calc(var(--pw)*.09);pointer-events:none;z-index:2}
.face.front .holes{left:0}.face.back .holes{right:0}
.holes i{position:absolute;width:calc(var(--pw)*.0319);height:calc(var(--pw)*.0318);transform:translateY(-50%);
  background:linear-gradient(180deg,#34302f,#4f4a48 45%,#8b8582);border-radius:1px;
  box-shadow:inset 0 2px 3px rgba(0,0,0,.55),inset -1.5px -1.5px 0 rgba(235,236,244,.75),0 0 0 .5px rgba(0,0,0,.25)}
.face.front .holes i{left:calc(var(--pw)*.0204)}.face.back .holes i{right:calc(var(--pw)*.0204)}
body.noholes .holes{display:none}
.spine{position:absolute;left:50%;top:0;width:calc(var(--pw)*.0586);height:var(--ph);transform:translateX(-50%);z-index:0;transition:opacity .5s;
  background:linear-gradient(90deg,rgba(30,18,10,.32),rgba(30,18,10,.1) 50%,rgba(30,18,10,.32));pointer-events:none}
.book.edge .spine{opacity:0}
.spiralA{position:absolute;left:50%;top:0;width:0;height:var(--ph);z-index:0;pointer-events:none}
.spiral{position:absolute;left:50%;top:0;width:0;height:var(--ph);z-index:5001;pointer-events:none}
.ring{position:absolute;display:block;pointer-events:none}
.ra{left:0;width:calc(var(--pw)*.1784);height:calc(var(--pw)*.0841);transform:translate(-50%,-50%);
  background:var(--ringAo) center/100% 100% no-repeat;filter:drop-shadow(0 calc(var(--pw)*.006) calc(var(--pw)*.006) rgba(30,18,8,.3))}
.book.edge .ra{background-image:var(--ringAc)}
.book.nr .ra{transform:translate(-50%,-50%) scaleX(-1)}
.rb{width:calc(var(--pw)*.0548);height:calc(var(--pw)*.0841);transform:translateY(-50%);background:var(--ringB) center/100% 100% no-repeat;
  filter:drop-shadow(0 calc(var(--pw)*.003) calc(var(--pw)*.004) rgba(20,12,8,.28));transition:opacity .01s linear .42s}
.rbr{left:calc(var(--pw)*.0293)}
.rbl{left:calc(var(--pw)*-.0841);transform:translateY(-50%) scaleX(-1)}
.book.nl .rbl,.book.nr .rbr{opacity:0}

/* navegación sobre la mesa */
.nav{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;
  background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:0 4px 14px rgba(40,25,15,.25);z-index:3}
.nav button{width:34px;height:34px;border-radius:50%;border:0;background:transparent;cursor:pointer;display:grid;place-items:center}
.nav button:hover:not(:disabled){background:var(--panel-2)}
.nav button:disabled{opacity:.35;cursor:default}
.nav output{min-width:130px;text-align:center;font-weight:500;font-variant-numeric:tabular-nums;padding:0 6px}
.emptycard{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,calc(100% - 32px));
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;text-align:center;box-shadow:0 10px 30px rgba(40,25,15,.3);z-index:4}
.emptycard h2{margin:0 0 6px;font-size:17px}
.emptycard p{margin:0 0 14px;color:var(--ink-2)}
.desk.empty .emptycard{display:block}
.desk.empty .book,.desk.empty .nav{display:none}
.dropveil{display:none;position:absolute;inset:10px;border:2px dashed var(--accent-ink);background:rgba(120,50,70,.55);color:#fff;
  align-items:center;justify-content:center;font-size:18px;font-weight:500;border-radius:14px;z-index:10;pointer-events:none}
body.dropping .dropveil{display:flex}

/* bandeja */
.trayw{background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;height:clamp(160px,28vh,320px);min-height:0}
body.collapsed .trayw{height:auto}
body.collapsed .tray{display:none}
.thead{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding-block:10px 6px}
.thead h2{margin:0;font-size:14px;font-weight:600;letter-spacing:.6px;text-transform:uppercase}
.thead p{margin:2px 0 0;font-size:12px;color:var(--ink-2)}
.opts{display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap}
.opt{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2)}
.opt input[type=color]{width:28px;height:24px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer}
.opt input[type=checkbox]{accent-color:var(--accent)}
.sw{display:flex;gap:5px}
.sw button{width:20px;height:20px;border-radius:50%;border:1px solid rgba(0,0,0,.25);cursor:pointer;padding:0}
.sw button[aria-pressed=true]{outline:2px solid var(--accent);outline-offset:2px}
.tiny{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--ink-2)}
.tray{--tw:74px;flex:1;min-height:0;overflow:auto;padding-block:6px 14px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:10px}
.pair{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 6px 4px;border-radius:9px;background:var(--panel-2);border:1.5px solid transparent;cursor:pointer}
.pair.cur{border-color:var(--accent)}
.pair .row{display:flex;gap:1px;min-height:calc(var(--tw)*1.4189)}
.pair .cap{font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.th{position:relative;width:var(--tw);aspect-ratio:148/210;background:#fff;box-shadow:0 0 0 1px var(--line);cursor:grab;flex:none}
.th img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}
.th.dragging{opacity:.35}
.th.sel{outline:2px solid var(--accent);outline-offset:-2px;z-index:2}
.th.pad{background:repeating-linear-gradient(45deg,var(--panel-2),var(--panel-2) 5px,var(--panel) 5px,var(--panel) 10px);cursor:default;display:grid;place-items:center;
  font-size:10px;color:var(--ink-2);text-align:center;padding:4px;box-sizing:border-box}
.th .num{position:absolute;top:2px;left:2px;font-size:10px;line-height:1.5;background:rgba(0,0,0,.58);color:#fff;border-radius:6px;padding:0 5px;font-variant-numeric:tabular-nums}
.th .tools{position:absolute;left:0;right:0;bottom:0;display:none;justify-content:space-between;background:rgba(30,20,20,.78);padding:2px}
.th:hover .tools,.th.sel .tools{display:flex}
.tools button{width:20px;height:20px;border:0;border-radius:4px;background:transparent;color:#fff;cursor:pointer;display:grid;place-items:center;padding:0}
.tools button:hover{background:rgba(255,255,255,.25)}
.pair .cap.grip{cursor:grab;padding:2px 8px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--ink)}
.pair .cap.grip:active{cursor:grabbing}
.pair.pdrag{opacity:.35}
.pair.ptgt{border-color:var(--accent);background:var(--panel)}
.pair.ptgt-a::after,.pair.ptgt-b::after{content:"";position:absolute;top:0;bottom:0;width:4px;background:var(--accent);border-radius:2px}
.pair{position:relative}
.pair.ptgt-b::after{left:-7px}.pair.ptgt-a::after{right:-7px}
.th.ins-b::before,.th.ins-a::before{content:"";position:absolute;top:-2px;bottom:-2px;width:4px;background:var(--accent);z-index:4;border-radius:2px}
.th.ins-b::before{left:-4px}.th.ins-a::before{right:-4px}
.endzone{display:none;width:var(--tw);aspect-ratio:148/210;border:2px dashed var(--line);border-radius:6px;align-items:center;justify-content:center;font-size:11px;color:var(--ink-2);text-align:center;box-sizing:border-box}
.tray.dragging .endzone{display:flex}
.endzone.over{border-color:var(--accent);color:var(--accent)}
.lib{display:flex;align-items:center;gap:8px;padding-block:8px;background:var(--panel-2);border-bottom:1px solid var(--line)}
.libl{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;padding:2px;scrollbar-width:thin}
.chip{flex:none;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:500;font-size:13px}
.chip:hover{border-color:var(--accent)}
.chip[aria-current=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ficha{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) minmax(0,1.6fr);gap:4px 14px;padding-block:8px;align-items:start;background:var(--panel);border-top:1px solid var(--line)}
.ficha label{display:flex;flex-direction:column;gap:3px;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-2);min-width:0}
.ficha input,.ficha textarea{font:inherit;font-size:14px;letter-spacing:0;text-transform:none;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;width:100%;box-sizing:border-box;resize:none}
.ficha input:focus,.ficha textarea:focus{border-color:var(--accent)}
.ficha .agcol{display:flex;flex-direction:column;gap:4px;align-items:flex-start}.ficha .agcol label{width:100%}
.ficha .vcol{display:flex;flex-direction:column;gap:6px;min-width:0}
.ficha .vlab{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-2)}
.ficha .vlab b{color:var(--accent);font-weight:600}
@media (max-width:760px){.ficha{grid-template-columns:1fr 1fr}.ficha .vcol:last-child{grid-column:1/-1}}@media (max-width:480px){.ficha{grid-template-columns:1fr}}
.share{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.share .btn{padding:5px 12px;font-size:12.5px}
.share small{flex-basis:100%;font-size:11px;color:var(--ink-2);line-height:1.3}
body.client .bar .acts,body.client .trayw,body.client .agcol,body.client .pair,body.client #newAg{display:none!important}
body.boot{visibility:hidden}
.brandrow{display:flex;align-items:center;gap:12px;min-width:0}
#backBtn{display:none}body.client.preview #backBtn{display:inline-flex}
body.client{grid-template-rows:auto auto minmax(0,1fr) auto}
body.client:not(.multi){grid-template-rows:auto minmax(0,1fr) auto}
body.client:not(.multi) .lib{display:none}
body.client .lib .libl{justify-content:center}
body.client .ficha{grid-template-columns:1fr 1.6fr}
body.client .ficha input,body.client .ficha textarea{background:transparent;border-color:transparent;padding-inline:0}
body.client .ficha .book,body.client .pen,body.client .cup{display:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:640px){.tray{--tw:58px}.trayw{height:clamp(200px,42vh,360px)}.nav output{min-width:104px}}
@media (prefers-reduced-motion:reduce){.book,.leaf{transition-duration:.01s!important}}
.face img,.th img,.book img{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
</style>

<header class="bar in">
  <div class="brandrow"><div class="brand"><strong>Visor de Agenda A5</strong><span>Así se verá el interior, con espiral al centro</span></div><button class="btn" id="backBtn" type="button">← Volver a editar</button></div>
  <div class="acts">
    <button class="btn primary" id="addBtn" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Agregar páginas
    </button>
    <button class="btn" id="fsBtn" type="button" title="Guarda todo en una carpeta de tu computador">Conectar carpeta</button>
    <button class="btn" id="exportBtn" type="button" title="Descarga un .zip con todas tus agendas, páginas, orden y notas">Guardar copia</button>
    <button class="btn" id="importBtn" type="button" title="Carga un .zip guardado antes con este visor">Cargar copia</button>
    <input id="zipIn" class="vh" type="file" accept=".zip,application/zip">
    <button class="btn" id="previewBtn" type="button" hidden>Ver como cliente</button>
    <button class="btn" id="clearBtn" type="button">Vaciar</button>
    <input id="fileIn" class="vh" type="file" accept="image/*,application/pdf,.pdf" multiple>
  </div>
</header>

<nav class="lib in" aria-label="Mis agendas">
  <div class="libl" id="libl"></div>
  <button class="btn primary" id="newAg" type="button">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    Nueva agenda
  </button>
</nav>

<section class="desk" id="desk" aria-label="Vista de la agenda">
  <div class="pen" aria-hidden="true"></div>
  <div class="cup" aria-hidden="true"></div>
  <div class="book" id="book"></div>
  <div class="nav" id="nav">
    <button id="prev" type="button" aria-label="Página anterior"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <output id="where" aria-live="polite"></output>
    <button id="next" type="button" aria-label="Página siguiente"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div class="emptycard">
    <h2>Aún no hay páginas</h2>
    <p>Sube tus páginas A5 como PNG, JPG o PDF. También puedes arrastrarlas aquí.</p>
    <button class="btn primary" id="addBtn2" type="button">Agregar páginas</button>
  </div>
  <div class="dropveil">Suelta tus páginas para agregarlas</div>
</section>

<section class="ficha in" id="ficha" aria-label="Título y detalle de lo que se ve">
  <div class="agcol">
    <label>Agenda<input id="aName" type="text" maxlength="60" placeholder="Nombre de la agenda" autocomplete="off"></label>
    <div class="share" id="share" hidden>
      <button class="btn primary" id="pubBtn" type="button">Publicar para cliente</button>
      <button class="btn" id="linkBtn" type="button" hidden>Copiar link cliente</button>
      <small id="shareMsg"></small>
    </div>
    <button class="tiny" id="delAg" type="button">Eliminar agenda</button>
  </div>
  <div class="vcol">
    <div class="vlab">Lo que estás viendo: <b id="vlab"></b></div>
    <input id="fTitle" type="text" maxlength="80" placeholder="Título de esta vista" autocomplete="off" aria-label="Título de esta vista">
  </div>
  <div class="vcol">
    <div class="vlab">Detalle</div>
    <textarea id="fDetail" rows="2" maxlength="600" placeholder="Qué contiene, qué falta corregir, notas para la imprenta…" aria-label="Detalle de esta vista"></textarea>
  </div>
</section>

<section class="trayw" aria-label="Orden de las páginas">
  <div class="thead in">
    <div><h2>Orden de las páginas</h2><p id="count" role="status"></p></div>

  function toUrl(b){try{var bin=atob(b),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return URL.createObjectURL(new Blob([a],{type:'image/png'}));}catch(e){return 'data:image/png;base64,'+b;}}

  function ringTop(k){return(((.102+k*.081)/1.4189)*100).toFixed(3);}
  function holeTop(k){return(((.102+k*.081-.0064)/1.4189)*100).toFixed(3);}
  function fitImg(img){
    function f(){var r=img.naturalHeight/img.naturalWidth;img.classList.toggle('fill',!!r&&Math.abs(r/1.4189-1)<.2);}
    if(img.complete&&img.naturalWidth)f();else img.addEventListener('load',f,{once:true});
  }
  function fitAll(root){[].forEach.call(root.querySelectorAll('img'),fitImg);}
  function buildBook(){
    E=eff();L=E.length/2;leaves=[];
    book.textContent='';
    var c0=E.find(function(p){return!p.pad&&p.src;});book.style.setProperty('--coverImg',c0?'url("'+c0.src+'")':'none');
    desk.classList.toggle('empty',!E.length);
    if(!E.length)return;
    var holes='',rings='',j;
    var rf='';
    for(j=0;j<RINGS;j++){var t=ringTop(j);holes+='<i style="top:'+holeTop(j)+'%"></i>';rings+='<b class="ring ra" style="top:'+t+'%"></b>';rf+='<b class="ring rb rbl" style="top:'+t+'%"></b><b class="ring rb rbr" style="top:'+t+'%"></b>';}
    function face(p,side){return '<div class="face '+side+'">'+(p.pad?'':'<img src="'+p.src+'" alt="" draggable="false">')+'<div class="holes">'+holes+'</div></div>';}
    var h='<div class="board bl"></div><div class="board br"></div><div class="stack sl"></div><div class="stack sr"></div><div class="spine"></div><div class="spiralA">'+rings+'</div>';
    for(var i=0;i<L;i++)h+='<div class="leaf">'+face(E[2*i],'front')+face(E[2*i+1],'back')+'</div>';
    h+='<div class="spiral">'+rf+'</div>';
    book.innerHTML=h;
    leaves=[].slice.call(book.querySelectorAll('.leaf'));fitAll(book);
    stackL=book.querySelector('.sl');stackR=book.querySelector('.sr');boardL=book.querySelector('.bl');boardR=book.querySelector('.br');
  }
  function go(k,anim){
    if(!L)return;
    k=Math.max(0,Math.min(L,k));
    if(anim===false)book.classList.add('noanim');
    spread=k;
    leaves.forEach(function(el,i){
      var f=i<k,was=el.classList.contains('flipped');
      el.classList.toggle('flipped',f);
      var z=f?i+1:L-i;
      clearTimeout(el._t);
      if(f!==was&&anim!==false){el.style.zIndex=4000;el._t=setTimeout(function(){el.style.zIndex=z;},900);}
      else el.style.zIndex=z;
    });
    book.classList.toggle('nl',k===0);book.classList.toggle('nr',k===L);book.classList.toggle('edge',k===0||k===L);
    book.style.setProperty('--shift',k===0?-.5293:(k===L?.5293:0));
    var tl=thick(k),tr=thick(L-k);
    stackL.style.boxShadow=stackShadow(tl,-1);stackR.style.boxShadow=stackShadow(tr,1);
    stackL.style.opacity=k>0?1:0;stackR.style.opacity=k<L?1:0;
    boardL.style.opacity=boardR.style.opacity=(k>0&&k<L)?1:0;
    boardL.style.cssText+=';left:calc(50% - var(--pw)*1.0293 - '+(tl+3)+'px);width:calc(var(--pw) + '+(tl+3)+'px);top:-2px;height:calc(var(--ph) + '+(tl+6)+'px)';
    boardR.style.cssText+=';left:calc(50% + var(--pw)*.0293);width:calc(var(--pw) + '+(tr+3)+'px);top:-2px;height:calc(var(--ph) + '+(tr+6)+'px)';

  }
  function viewKey(){

  async function exportZip(){
    if(cur)cur.pages=pages;
    var list=lib.filter(function(a){return!a.sample&&a.pages.some(function(p){return p.blob;});});
    if(!list.length){say('Aún no hay páginas tuyas para guardar.',4000);return;}
    var dl=null;try{dl=await claude.use('downloads');}catch(e){}
    say('Preparando copia…');
    var files=[],meta={version:1,saved:new Date().toISOString(),agendas:[]};
    for(var i=0;i<list.length;i++){
      var a=list[i],dir='agendas/'+String(i+1).padStart(2,'0')+'-'+slug(a.title)+'/',pm=[],real=a.pages.filter(function(p){return p.blob;});
      for(var j=0;j<real.length;j++){
        var p=real[j],fn=dir+'pagina-'+String(j+1).padStart(3,'0')+'.'+extOf(p.blob.type);
        files.push({name:fn,data:new Uint8Array(await p.blob.arrayBuffer())});
        pm.push({id:p.id,name:p.name,file:fn});
      }
      meta.agendas.push({id:a.id,title:a.title,detail:a.detail||'',notes:a.notes||{},pages:pm});
    }
    files.unshift({name:'agendas.json',data:new TextEncoder().encode(JSON.stringify(meta,null,1))});
    var blob=zipBuild(files),name='visor-agenda-copia-'+new Date().toISOString().slice(0,10)+'.zip';
    try{
      if(dl)await dl.save({filename:name,data:blob});
      else{var u=URL.createObjectURL(blob),a2=document.createElement('a');a2.href=u;a2.download=name;document.body.appendChild(a2);a2.click();a2.remove();setTimeout(function(){URL.revokeObjectURL(u);},4000);}
      say('Copia lista: '+name,6000);
    }catch(e){say(e&&e.code==='declined'?'Descarga cancelada.':'No se pudo guardar la copia.',5000);}
  }
  async function importZip(file){
    try{
      say('Leyendo copia…');
      var ents=await zipRead(await file.arrayBuffer());
      var metaRaw=ents['agendas.json'];if(!metaRaw)throw new Error('formato');
      var meta=JSON.parse(new TextDecoder().decode(metaRaw)),added=[];
      meta.agendas.forEach(function(m){
        var pg=[];
        (m.pages||[]).forEach(function(p){
          var d=ents[p.file];if(!d)return;
          var b=new Blob([d],{type:mimeOf(p.file)});
          pg.push({id:p.id||uid(),name:p.name||p.file,blob:b,src:URL.createObjectURL(b)});
        });
        var ex=lib.findIndex(function(a){return a.id===m.id;});
        var a={id:m.id||('a'+Date.now().toString(36)),title:m.title||'Agenda',detail:m.detail||'',notes:m.notes||{},shared:null,sample:false,pages:pg};
        if(ex>=0)lib[ex]=a;else lib.push(a);
        added.push(a);
      });
      if(!added.length)throw new Error('vacío');
      lib=lib.filter(function(a){return!a.sample;});
      cur=null;switchTo(added[0],true);saveNow();
      say('Cargué '+added.length+' agenda(s) desde la copia.',6000);
    }catch(e){say('No pude leer ese archivo. Usa un .zip guardado con "Guardar copia".',7000);}
  }
  $('#exportBtn').addEventListener('click',exportZip);
  $('#importBtn').addEventListener('click',function(){if(!RO)$('#zipIn').click();});
  $('#zipIn').addEventListener('change',function(e){var f=e.target.files[0];e.target.value='';if(f&&!RO)importZip(f);});

  /* ---------- compartir con cliente ---------- */
  var FORCE=/^#cliente/.test(location.hash),CL=(location.hash.match(/^#cliente=([\w-]+)/)||[])[1]||null;
  var PAGE_URL='https://claude.ai/artifact/G2dkqJTRAfhCZo1GEh2nt1';
  var dbNS=null,assetsNS=null,isEditor=true;
  function shareMsg(t){$('#shareMsg').textContent=t||'';}
  function syncShare(){
    var box=$('#share');if(!cur||RO)return;
    var ok=!!(dbNS&&assetsNS)&&!cur.sample&&pages.length>0;
    box.hidden=!(dbNS&&assetsNS);
    $('#pubBtn').disabled=!ok;
    $('#pubBtn').textContent=cur.shared?'Actualizar vista cliente':'Publicar para cliente';
    $('#linkBtn').hidden=!cur.shared;
    $('#previewBtn').hidden=!(isEditor&&!cur.sample&&pages.length>0);
    if(!ok&&!box.hidden)shareMsg(cur.sample?'Sube tus páginas para poder publicarlas.':'');
  }
  async function publish(){
    var a=cur,btn=$('#pubBtn');if(!a||!dbNS||!assetsNS||RO)return;
    a.pages=pages;btn.disabled=true;
    try{
      var real=pages.filter(function(p){return!p.sample&&p.blob;});
      for(var i=0;i<real.length;i++){
        var p=real[i];
        if(!p.asset){shareMsg('Subiendo página '+(i+1)+' de '+real.length+'…');var r=await assetsNS.upload(p.blob);p.asset=r.id;}
      }
      shareMsg('Guardando…');
      var now=Date.now();
      await dbNS.doc('shared/'+a.id).set({title:a.title||'Agenda',notes:a.notes||{},pages:real.map(function(p){return{id:p.id,asset:p.asset};}),updated:now});
      var idx=await dbNS.doc('shared/index').get(),list=(idx.exists&&idx.data().list)||[];
      list=list.filter(function(e){return e.id!==a.id;});list.push({id:a.id,title:a.title||'Agenda',updated:now});
      await dbNS.doc('shared/index').set({list:list});
      a.shared=now;saveNow();syncShare();
      shareMsg('Listo. El cliente ve el orden y las notas actuales. Si cambias algo, pulsa Actualizar.');
    }catch(err){
      var c=err&&err.code;
      shareMsg(c==='not_granted'||c==='permission_denied'?'No tienes permiso para publicar desde esta vista.':'No se pudo publicar'+(err&&err.message?': '+err.message:'')+'. Intenta de nuevo.');
    }
    btn.disabled=false;
  }
  $('#pubBtn').addEventListener('click',publish);
  $('#linkBtn').addEventListener('click',async function(){
    var url=PAGE_URL+'#cliente',b=this;
    try{await navigator.clipboard.writeText(url);b.textContent='¡Link copiado!';}
    catch(e){var t=document.createElement('textarea');t.value=url;document.body.appendChild(t);t.select();try{document.execCommand('copy');b.textContent='¡Link copiado!';}catch(x){b.textContent='No se pudo copiar';}t.remove();}
    shareMsg('Quien abra este link sin permiso de edición ve solo la vista de cliente. Tú, al ser editor, puedes verla con "Ver como cliente". Compártelo antes con el botón Compartir de Claude.');
    setTimeout(function(){b.textContent='Copiar link cliente';},2500);
  });
  /* vista de cliente: se activa por permisos, no por el link */
  function enterClientUI(){
    RO=true;document.body.classList.add('client');
    $('.brand span').textContent='Vista para cliente';
    $('#fTitle').readOnly=$('#fDetail').readOnly=$('#aName').readOnly=true;
    $('#fTitle').placeholder=$('#fDetail').placeholder='';
  }
  async function openRemote(a){
    try{
      if(!a.pages){
        var snap=await dbNS.doc('shared/'+a.id).get();if(!snap.exists)throw 1;
        var v=snap.data();a.notes=v.notes||{};a.title=v.title||a.title;
        a.pages=(v.pages||[]).map(function(p){return{id:p.id,name:'',src:'/_blob/'+p.asset};});
      }
      cur=a;pages=a.pages;sel=null;spread=0;
      document.title=a.title||'Agenda';$('.brand strong').textContent=a.title||'Agenda';
      $('.emptycard h2').textContent='Esta agenda aún no tiene páginas';
      renderLib();refresh(null,false);syncFicha();
    }catch(e){clientError();}
  }
  function clientError(){
    pages=[];cur=null;refresh(null,false);desk.classList.add('empty');
    $('.emptycard h2').textContent='No se pudo abrir esta agenda';
    $('.emptycard p').textContent='Puede que el link esté incompleto o que necesites iniciar sesión en Claude para verla.';$('#addBtn2').style.display='none';
  }
  async function initClient(){
    enterClientUI();
    desk.classList.add('empty');$('.emptycard h2').textContent='Cargando agenda…';$('.emptycard p').textContent='';$('#addBtn2').style.display='none';
    var tm=setTimeout(function(){$('.emptycard h2').textContent='Tarda más de lo normal…';$('.emptycard p').textContent='Si no carga, puede que necesites abrir la página con tu sesión de Claude.';},10000);
    try{
      if(!dbNS)throw 0;
      var idx=await dbNS.doc('shared/index').get(),list=(idx.exists&&idx.data().list)||[];
      clearTimeout(tm);
      if(!list.length)throw 1;
      list.sort(function(x,y){return(y.updated||0)-(x.updated||0);});
      lib=list.map(function(e){return{id:e.id,title:e.title||'Agenda',pages:null,notes:{},sample:false,remote:true};});
      document.body.classList.toggle('multi',lib.length>1);
      await openRemote(lib.find(function(a){return a.id===CL;})||lib[0]);
    }catch(e){clearTimeout(tm);clientError();}
  }
  /* vista previa para quien edita */
  $('#previewBtn').addEventListener('click',function(){
    if(cur)cur.pages=pages;saveNow();
    RO=true;document.body.classList.add('client','preview');document.body.classList.remove('multi');
    $('.brand span').textContent='Así lo verá el cliente';
    $('#fTitle').readOnly=$('#fDetail').readOnly=true;
    syncFicha();computeSize();
  });
  $('#backBtn').addEventListener('click',function(){
    RO=false;document.body.classList.remove('client','preview');
    $('.brand span').textContent='Así se verá el interior, con espiral al centro';
    $('#fTitle').readOnly=$('#fDetail').readOnly=false;
    $('#aName').readOnly=false;
    if(!cur||cur.remote){lib=[];document.body.classList.remove('multi');startEditor();syncShare();}
    syncFicha();computeSize();
  });
  window.addEventListener('keydown',function(e){if(RO&&(e.key==='Delete'||e.key==='Backspace')&&!/INPUT|TEXTAREA/.test(e.target.tagName))e.preventDefault();});

  /* ---------- inicio ---------- */
  function startEditor(){
    (function(){var a=newAg('Agenda de ejemplo',true);a.pages=samplePages();lib=[a];cur=a;pages=a.pages;})();
    renderLib();refresh(null,false);syncFicha();
    loadSaved().then(function(saved){
      if(RO||FS.on||!saved)return;
      var arr=saved.lib;
      if((!arr||!arr.length)&&saved.legacy&&saved.legacy.length)arr=[{id:'a-legacy',title:'Mi agenda',detail:'',notes:{},pages:saved.legacy}];
      if(!arr||!arr.length)return;
      if(!(cur&&cur.sample)&&cur&&cur.pages.length)return; /* ya empezó a trabajar */
      lib=arr.map(function(a){return{id:a.id,title:a.title||'Mi agenda',detail:a.detail||'',notes:a.notes||{},shared:a.shared||null,sample:false,pages:(a.pages||[]).map(function(p){return{id:p.id,name:p.name,blob:p.blob,asset:p.asset||null,src:URL.createObjectURL(p.blob)};})};});
      var c=lib.find(function(a){return a.id===saved.cur;})||lib[0];
      cur=null;switchTo(c,true);
    });
  }
  /* vista pública estática: el HTML trae sus datos en window.__PUBLIC */
  function startPublic(P){
    if(P.wire)prefs.wire=P.wire;applyPrefs();
    enterClientUI();$('.brand span').textContent=P.subtitle||'Vista de la agenda';
    var a=newAg(P.title||'Agenda',false);a.notes=P.notes||{};
    a.pages=P.pages.map(function(p){return{id:p.id,name:'',src:p.src};});
    lib=[a];cur=a;pages=a.pages;
    document.title=a.title;$('.brand strong').textContent=a.title;
    refresh(null,false);syncFicha();
  }
  applyPrefs();
  if(window.__PUBLIC){startPublic(window.__PUBLIC);return;}
  document.body.classList.add('boot');
  (async function boot(){
    var u=null,hasPlatform=(typeof claude!=='undefined'&&claude&&typeof claude.use==='function');
    if(hasPlatform){
      var t=new Promise(function(r){setTimeout(function(){r('timeout');},6000);});
      try{
        var got=await Promise.race([Promise.all([claude.use('user'),claude.use('db'),claude.use('assets')]),t]);
        if(got!=='timeout'){u=got[0];dbNS=got[1];assetsNS=got[2];}
      }catch(e){}
      isEditor=!!(u&&typeof u.canEdit==='function'&&u.canEdit());
    }
    if(isEditor&&!FORCE){startEditor();syncShare();fsInit();}
    else{if(isEditor)document.body.classList.add('preview');initClient();}
    document.body.classList.remove('boot');
  })();
})();
</script>
